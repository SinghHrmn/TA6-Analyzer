[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ta6-analyser"
version = "0.1.0"
description = "AI-assisted document analysis and enquiry generation for UK residential conveyancing (TA6 forms)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "reportlab>=4.0",
    "img2pdf>=0.5",
    "pillow>=10.0",
    "flask>=3.0",
]

[project.optional-dependencies]
# Only needed if you use the Anthropic backend for the NLI stage.
anthropic = ["anthropic>=0.34"]

[tool.setuptools]
packages = ["ta6"]
